---
version: 2

run:
  timeout: 5m
  tests: true

# Global linter policy (used for production code in local_ci.sh)
# Tests are linted in a separate pass with "unused" only.
linters:
  preset: none
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - goconst
    - unparam
    - revive
    - copyloopvar
    - bodyclose
    - unconvert
    - prealloc
    - predeclared
    - cyclop
    - nestif
    - dupl
    - errorlint
    - thelper
    - misspell
    - unused
  exclusions:
    rules:
      # Upstream SPT core: the docker argument builder names its loop variable
      # "cap" (a Linux capability). Renaming it is behaviour-neutral, but this
      # team does not edit engine/core files, so the one finding is excluded
      # here, by path and message, instead of in the code.
      - path: internal/docker/command/builder\.go
        linters:
          - predeclared
        text: "cap: shadows predeclared identifier"

issues:
  exclude-use-default: false

linters-settings:
  cyclop:
    max-complexity: 30
